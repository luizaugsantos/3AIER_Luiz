[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Marcadores para execução granular dos testes
markers =
    unit: Testes unitários do código Python local (Opção 1)
    contract: Testes de contrato e validação de schemas de ferramentas (Opção 2)
    integration: Testes de integração e simulação com mocks da API (Opção 3)
    eval: Testes de avaliação, qualidade e fidelidade do agente (Opção 4)
    security: Testes de segurança, robustez e red teaming (Opção 5)
    memory: Testes de gerenciamento de estado e memória (Opção 6)
    ui: Testes de interface de usuário com Streamlit (Opção 7)
    live_api: Testes que necessitam de conexão real com a API da OpenAI
